version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: incubrix_postgres
    restart: always
    environment:
      POSTGRES_USER: incubrix_user
      POSTGRES_PASSWORD: incubrix_password
      POSTGRES_DB: incubrix_visibility
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: incubrix_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: incubrix_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://incubrix_user:incubrix_password@db:5432/incubrix_visibility
      REDIS_URL: redis://redis:6379/0
      TARGET_WEBSITE: https://incubrix.com
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incubrix_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
